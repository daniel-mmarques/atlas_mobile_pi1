name: atlas_mobile_pi1
description: "Atlas — app Flutter PI1 com autenticação e perfil físico."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  provider: ^6.1.5+1
  go_router: ^14.8.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  google_fonts: ^8.0.2
  slide_to_act: ^2.0.2
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  lottie: ^3.3.3
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/atlas_logo.png
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  adaptive_icon_background: "#0A0A0D"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0A0D"
  image: assets/atlas_logo.png
  android_12:
    color: "#0A0A0D"
    image: assets/atlas_logo.png
  ios: true
  android: true
